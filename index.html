<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/QDrop/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QDrop — AirDrop, without the network</title>
    <script>
      // GitHub Pages SPA fallback: redirect 404.html to the actual route
      (function () {
        var redirect = sessionStorage.getItem('qdrop:redirect')
        if (redirect) {
          sessionStorage.removeItem('qdrop:redirect')
          history.replaceState(null, '', redirect)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
