<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>QDrop — Redirecting...</title>

      // Save the attempted path so the app can restore it after redirect
      sessionStorage.setItem('qdrop:redirect', location.href)
      location.replace('/QDrop/')
    </script>

    <p><a href="/QDrop/">Continue to QDrop</a></p>
  </body>
</html>
